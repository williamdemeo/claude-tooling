# projects.toml — the manifest driving install.sh / check / probe.
#
# Plain TOML, parsed by Python's stdlib `tomllib` (see scripts/ct.py) — no
# subset caveats: quoted keys, '#' inside values and inline comments all work.
# (Until the Python port it was a restricted subset a bespoke awk parser could
# read; that restriction is gone.)
#
# Per project:
#   parent = project parent dir; holds the symlinked CLAUDE.md and the real
#            .claude/ whose members link into this repo;
#   main   = main-checkout dir name under parent (fetch/pull/worktree-add
#            happen there; settings + auto-memory resolve to it);
#   mode   = "symlink"   -> managed here, deployed by install.sh;
#            "committed" -> Claude config committed in that repo for its
#                           consumers (product config); installer must not touch it.
#
# There is deliberately no worktrees field: worktree enumeration always comes
# from `git worktree list --porcelain` in the main checkout, which is the
# source of truth no matter which container dirs worktrees live in.

[meta]
canonical_root = "~/git/williamdemeo/claude-tooling/main"

[projects.fls]
parent = "~/git/IO/fls"
main   = "master"
mode   = "symlink"

[projects.agda-algebras]
parent = "~/git/ualib/agda-algebras"
main   = "master"
mode   = "symlink"

[projects.agda-native-air]
parent = "~/git/formalverification/agda-native-air"
main   = "main"
mode   = "symlink"

[projects."williamdemeo.github.io"]
parent = "~/git/williamdemeo/williamdemeo.github.io"
main   = "main"
mode   = "symlink"

# Product-config repo: ships .claude/skills for its consumers (the template users).
# Listed so tooling knows it exists; never touched by install.sh.
[projects.github-project]
parent = "~/git/williamdemeo/github-project"
main   = "main"
mode   = "committed"
